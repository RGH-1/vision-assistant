[project]
name = "vision-assistant"
version = "0.0.1"
description = "Voice assistant for blind and visually impaired users: live phone video, multimedia memory, spoken answers."
readme = "README.md"
# 3.12 on purpose: GPU wheels (torch, ultralytics, easyocr) lag behind newer Pythons (design §4).
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the task that needs them (`uv add <pkg>`),
# and only if the library is listed in design §4.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mobile", "dashboard", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "eval"]
addopts = "-q"
