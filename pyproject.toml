[project]
name = "vision-assistant"
version = "0.0.1"
description = "Voice assistant for blind and visually impaired users: live phone video, multimedia memory, spoken answers."
readme = "README.md"
# 3.12 on purpose: GPU wheels (torch, ultralytics, easyocr) lag behind newer Pythons (design §4).
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the task that needs them (`uv add <pkg>`),
# and only if the library is listed in design §4.
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.34.0",
    "groq>=1.7.0",
    "opencv-python>=5.0.0.93",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "sentence-transformers>=6.2.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.202",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mobile", "dashboard", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "eval"]
addopts = "-q"
