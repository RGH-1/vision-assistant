# Tunable values, kept in git so changes show in the history (design §8.3).
# Secrets and per-machine settings go in .env instead.

host: 0.0.0.0 # the phone reaches the server over the LAN (§8.1)
port: 8000
mediamtx_webrtc_port: 8889 # §6.2
cors_origins: # the dashboard's Vite dev server
  - http://localhost:5173
  - http://127.0.0.1:5173
clip_text_model: clip-ViT-B-32-multilingual-v1 # §4
ingest_no_frame_timeout_s: 3
ingest_reconnect_delay_s: 0.25
status_interval_s: 2 # §8.2
ws_ping_interval_s: 15 # §8.2
ws_send_timeout_s: 2 # a client this slow is dropped, and it reconnects
stt_timeout_s: 15 # §6.4
stt_min_avg_logprob: -0.65 # measured: clear speech -0.06 to -0.20, muffled -0.74 (§6.5.1)
gemini_timeout_s: 30 # §6.4
gemini_temperature: 0.2 # §6.5.4

frame_selection:
  analysis_width: 640
  sharpness_min: 60
  sharpness_median_factor: 0.6
  sharpness_soft_ratio: 0.6
  sharpness_history_size: 50
  brightness_dark: 60
  brightness_bright: 220
  contrast_min: 25
  unsharp_sigma: 1.0
  unsharp_amount: 1.0
  severe_blur_ratio: 0.01

frame_enhancement:
  dark_brightness: 60
  gamma_min: 0.6
  gamma_max: 0.8
  clahe_clip_limit: 2.0
  clahe_tile_size: 8
  unsharp_sigma: 1.0
  unsharp_amount: 1.0

frame_novelty:
  new_distance: 12
  duplicate_distance: 5
  heartbeat_seconds: 10
